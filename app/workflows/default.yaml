workflows:
  default:
    description: 默认工作流，仅做摘要
    steps:
      - tool: summarize_text

  email_spam:
    description: 垃圾邮件 → 归档
    steps:
      - tool: classify_email
      - tool: write_db

  email_support:
    description: 客服邮件 → 摘要 + 抽单 + 生成回复
    steps:
      - tool: summarize_text
      - tool: extract_ticket
      - tool: draft_reply
      - tool: write_db
        condition: "urgency == 'high'"

  review_negative:
    description: 负面评价 → 情感抽取 + 告警
    steps:
      - tool: sentiment_aspect
      - tool: alert_ops
      - tool: write_db

  news_finance:
    description: 财经新闻 → 摘要 + 实体抽取
    steps:
      - tool: summarize_text
      - tool: translate_text
        with:
          target_lang: 英文
          style: formal
      - tool: extract_entities

  translate_only:
    description: 纯翻译工作流
    steps:
      - tool: translate_text
        with:
          target_lang: 英文
          style: formal

  translate_summary:
    description: 先摘要再翻译
    steps:
      - tool: summarize_and_translate

  travel_tagging:
    description: 旅游产品行程 → 字段抽取 + 标签生成 + 归一化 + 汇总
    steps:
      - tool: extract_itinerary_fields
      - tool: generate_travel_tags
      - tool: normalize_tags
      - tool: render_tag_summary

  text_correction:
    description: 文本纠错 + 安全校验
    steps:
      - tool: correct_text
      - tool: verify_correction

  excel_nl_ops:
    description: 自然语言操作 Excel（描述 → 计划 → 执行 → 回答）
    steps:
      - tool: excel_describe
      - tool: excel_plan
      - tool: excel_execute
      - tool: excel_answer

  doc_qa:
    description: 基于本地知识库的 RAG 问答
    steps:
      - tool: rag_answer

  doc_ingest_and_qa:
    description: 上传文档并立即问答
    steps:
      - tool: rag_ingest
      - tool: rag_answer

  # ===== TASKS.md 阶段五新增工作流 =====
  # input_from 用于显式指定从上游哪一步的输出取值（引擎上下文为平铺合并）

  content_factory:
    description: 标题 → 扩写 → 润色 的全流程内容生产
    steps:
      - tool: generate_hooks
      - tool: expand_article
        with:
          input_from: hooks          # 取标题列表首个作为扩写素材
      - tool: rewrite_style
        with:
          input_from: expanded
          style: 小红书风
      - tool: polish_copy
        with:
          input_from: rewritten

  study_buddy:
    description: 检索知识库 → 大白话讲解 → 出题 → 制卡
    steps:
      - tool: rag_search
      - tool: feynman_explain
        with:
          input_from: chunks         # 参考材料取自检索片段
          audience: 外行
      - tool: generate_quiz
        with:
          input_from: chunks
          count: 5
          difficulty: medium
      - tool: flashcards
        with:
          input_from: chunks
          count: 10

  meeting_secretary:
    description: 会议记录 → 待办提取 → 写库 → 邮件通知
    steps:
      - tool: meeting_notes
      - tool: task_extractor
      - tool: write_db
      - tool: email_compose
        with:
          tone: 正式
          # email_compose 自动从上游 todos 拼接为邮件要点

  support_qa:
    description: 客服文本 → 分类 → 情感 → 结果评审 → 告警
    steps:
      - tool: classify_email
      - tool: sentiment_aspect
      - tool: result_critic
        with:
          input_from: summary        # 评审情感抽取的摘要
      - tool: alert_ops
        condition: "score < 6"       # 低分触发告警