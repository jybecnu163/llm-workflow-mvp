workflows:
  default:
    description: 默认工作流，仅做摘要
    steps:
      - tool: summarize_text

  email_spam:
    description: 垃圾邮件 → 归档
    steps:
      - tool: classify_email
      - tool: write_db

  email_support:
    description: 客服邮件 → 摘要 + 抽单 + 生成回复
    steps:
      - tool: summarize_text
      - tool: extract_ticket
      - tool: draft_reply
      - tool: write_db
        condition: "urgency == 'high'"

  review_negative:
    description: 负面评价 → 情感抽取 + 告警
    steps:
      - tool: sentiment_aspect
      - tool: alert_ops
      - tool: write_db

  news_finance:
    description: 财经新闻 → 摘要 + 实体抽取
    steps:
      - tool: summarize_text
      - tool: translate_text
        with:
          target_lang: 英文
          style: formal
      - tool: extract_entities

  translate_only:
    description: 纯翻译工作流
    steps:
      - tool: translate_text
        with:
          target_lang: 英文
          style: formal

  translate_summary:
    description: 先摘要再翻译
    steps:
      - tool: summarize_and_translate

  travel_tagging:
    description: 旅游产品行程 → 字段抽取 + 标签生成 + 归一化 + 汇总
    steps:
      - tool: extract_itinerary_fields
      - tool: generate_travel_tags
      - tool: normalize_tags
      - tool: render_tag_summary

  text_correction:
    description: 文本纠错 + 安全校验
    steps:
      - tool: correct_text
      - tool: verify_correction

  excel_nl_ops:
    description: 自然语言操作 Excel（描述 → 计划 → 执行 → 回答）
    steps:
      - tool: excel_describe
      - tool: excel_plan
      - tool: excel_execute
      - tool: excel_answer

  doc_qa:
    description: 基于本地知识库的 RAG 问答
    steps:
      - tool: rag_answer

  doc_ingest_and_qa:
    description: 上传文档并立即问答
    steps:
      - tool: rag_ingest
      - tool: rag_answer

  # ===== TASKS.md 阶段五新增工作流 =====
  # input_from 用于显式指定从上游哪一步的输出取值（引擎上下文为平铺合并）

  content_factory:
    description: 标题 → 扩写 → 润色 的全流程内容生产
    steps:
      - tool: generate_hooks
      - tool: expand_article
        with:
          input_from: hooks          # 取标题列表首个作为扩写素材
      - tool: rewrite_style
        with:
          input_from: expanded
          style: 小红书风
      - tool: polish_copy
        with:
          input_from: rewritten

  study_buddy:
    description: 检索知识库 → 大白话讲解 → 出题 → 制卡
    steps:
      - tool: rag_search
      - tool: feynman_explain
        with:
          input_from: chunks         # 参考材料取自检索片段
          audience: 外行
      - tool: generate_quiz
        with:
          input_from: chunks
          count: 5
          difficulty: medium
      - tool: flashcards
        with:
          input_from: chunks
          count: 10

  meeting_secretary:
    description: 会议记录 → 待办提取 → 写库 → 邮件通知
    steps:
      - tool: meeting_notes
      - tool: task_extractor
      - tool: write_db
      - tool: email_compose
        with:
          tone: 正式
          # email_compose 自动从上游 todos 拼接为邮件要点

  support_qa:
    description: 客服文本 → 分类 → 情感 → 结果评审 → 告警
    steps:
      - tool: classify_email
      - tool: sentiment_aspect
      - tool: result_critic
        with:
          input_from: summary        # 评审情感抽取的摘要
      - tool: alert_ops
        condition: "score < 6"       # 低分触发告警

  # ===== TASKS.md 批次二阶段十二新增工作流 =====

  data_cleaning_pipeline:
    description: 表格抽取 → 校验 → 结构化 → 美化
    steps:
      - tool: extract_table
      - tool: json_validator
        with:
          input_from: tables
      - tool: text_to_json
        with:
          fields: ["类别", "数值", "备注"]
      - tool: markdown_table

  smart_meeting_upgrade:
    description: 会议 → 任务 → 优先级矩阵 → 邮件
    steps:
      - tool: meeting_notes
      - tool: task_extractor
      - tool: priority_matrix
        with:
          input_from: tasks
      - tool: email_compose
        with:
          tone: 正式

  code_review_assistant:
    description: 代码审查 → 解释 → 测试用例 → 双重评审
    steps:
      - tool: code_review
      - tool: explain_code
      - tool: generate_test_cases
      - tool: result_critic
        with:
          criteria: 审查完整性与建议可行性

  rag_enhanced_search:
    description: 关键词提取 → 查询改写 → 多路检索问答
    steps:
      - tool: keyword_extractor
      - tool: rag_rewrite_query
      - tool: rag_answer_v2
        with:
          top_k: 8

  # ===== 全工具覆盖工作流：补齐此前未被任何流程使用的 24 个工具 =====

  news_intelligence:
    description: 新闻情报：语言识别 → 分类 → 摘要 → 关键词 → 翻译 → 话题标签
    steps:
      - tool: language_detect
      - tool: classify_news
      - tool: summarize_text
      - tool: keyword_extractor
        with:
          input_from: summary
      - tool: translate_text
        with:
          input_from: summary
          target_lang: 英文
      - tool: hashtag_generator
        with:
          input_from: summary
          platform: weibo

  content_seo_optimizer:
    description: SEO内容优化：统计 → 可读性 → 关键词 → 润色 → 表格
    steps:
      - tool: text_statistics
      - tool: readability_check
      - tool: seo_keywords
      - tool: polish_copy
        with:
          style: 商务风
      - tool: markdown_table
        with:
          input_from: placement

  knowledge_mindmap:
    description: 知识导图学习：检索 → 导图 → 费曼讲解 → 记忆卡
    steps:
      - tool: rag_search
      - tool: mindmap_outline
        with:
          input_from: chunks
      - tool: feynman_explain
        with:
          input_from: outline
          audience: 外行
      - tool: flashcards
        with:
          input_from: explanation
          count: 8

  decision_advisor:
    description: 决策顾问：利弊 → SWOT → 风险评估 → 决策邮件
    steps:
      - tool: pros_cons
      - tool: swot_analysis
      - tool: risk_assessment
      - tool: email_compose
        with:
          input_from: recommendation
          tone: 正式

  dev_delivery:
    description: 开发交付：代码审查 → 解释 → 测试用例 → 提交信息 → 评审
    steps:
      - tool: code_review
      - tool: explain_code
      - tool: generate_test_cases
      - tool: commit_message
        with:
          input_from: code
      - tool: result_critic
        with:
          input_from: summary
          criteria: 审查完整性、测试覆盖率、提交规范性

  proofread_professional:
    description: 专业校对：整体纠错 → 逐句纠错 → 术语保护 → 安全校验
    steps:
      - tool: correct_text
      - tool: correct_text_by_sentence
      - tool: protect_terms
      - tool: verify_correction

  text_cleanup:
    description: 文本清洗：行去重 → 统计 → 关键词 → Markdown表格
    steps:
      - tool: dedupe_lines
      - tool: text_statistics
      - tool: keyword_extractor
      - tool: markdown_table
        with:
          input_from: keywords

  tag_aggregation:
    description: 标签聚合：标签生成 → 归一化 → 置信度投票合并 → 表格
    steps:
      - tool: generate_travel_tags
      - tool: normalize_tags
      - tool: merge_tags
        with:
          input_from: normalized
      - tool: markdown_table
        with:
          input_from: merged

  prompt_lab:
    description: Prompt实验室：Prompt诊断 → 工具匹配 → 工作流诊断 → 评审
    steps:
      - tool: prompt_doctor
      - tool: tool_matchmaker
        with:
          input_from: optimized
      - tool: workflow_advisor
        with:
          name: email_support
      - tool: result_critic
        with:
          input_from: optimized

  deck_builder:
    description: PPT生成器：摘要 → 幻灯片大纲 → Markdown表格
    steps:
      - tool: summarize_text
      - tool: slide_outline
        with:
          input_from: summary
          pages: 6
      - tool: markdown_table
        with:
          input_from: slides

  sql_analyst:
    description: SQL分析：自然语言转SQL → 质量评审 → 邮件报告
    steps:
      - tool: sql_generator
      - tool: result_critic
        with:
          input_from: sql
          criteria: SQL正确性、可读性、性能
      - tool: email_compose
        with:
          input_from: explanation
          tone: 正式

  novel_kb_builder:
    description: 小说知识库：批量入库分回 → 增强问答（三国演义）
    steps:
      - tool: rag_ingest_chapter_dir
        with:
          dir: sanguo
      - tool: rag_answer_v2
        with:
          top_k: 8

  regex_assistant:
    description: 正则助手：生成正则 → 测试用例表格
    steps:
      - tool: regex_generator
      - tool: markdown_table
        with:
          input_from: test_cases

  format_validator:
    description: 格式校验：JSON校验 → 键表格 → 文本统计 → YAML校验
    steps:
      - tool: json_validator
      - tool: markdown_table
        with:
          input_from: keys
      - tool: text_statistics
        with:
          input_from: formatted
      - tool: yaml_validator
        with:
          input_from: formatted
          condition: "valid == true"

  cron_helper:
    description: Cron助手：表达式解析 → 说明邮件
    steps:
      - tool: cron_explainer
      - tool: email_compose
        with:
          input_from: description
          tone: 简洁